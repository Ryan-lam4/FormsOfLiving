<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slideshow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: #fff;
    }
    #slideshow {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 10px 20px;
      border-radius: 30px;
      display: flex;
      gap: 15px;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    body:hover .controls { opacity: 1; }
    button {
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: rgba(255,255,255,0.2); }
    #counter { font-size: 14px; min-width: 60px; text-align: center; }
  </style>
</head>
<body>
  <img id="slideshow" src="" alt="Slideshow">
  <div class="controls">
    <button id="prev">‹</button>
    <button id="next">›</button>
    <span id="counter"></span>
  </div>

  <script>
    // ==== EDIT THIS LIST ====
    const images = [
      "images/st1.png",
      "images/st2.png",
      "images/st3.png",
      "images/st4.png",
      "images/st5.png",
      "images/st6.png",
      "images/st7.png",
      "images/st8.png",
      "images/st9.png",
      "images/st10.png",
      "images/st11.png",
      "images/st12.png",
      "images/st13.png",
      "images/st14.png",
      "images/st15.png",
      "images/st16.png",
    ];
    // ========================

    const imgEl = document.getElementById('slideshow');
    const counterEl = document.getElementById('counter');

    let index = 0;

    function show(i) {
      index = (i + images.length) % images.length;
      imgEl.src = images[index];
      counterEl.textContent = `${index + 1} / ${images.length}`;
    }

    function next() { show(index + 1); }
    function prev() { show(index - 1); }

    document.getElementById('next').onclick = next;
    document.getElementById('prev').onclick = prev;

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft')  prev();
    });

    // Preload all images so switching is instant
    images.forEach(src => {
      const img = new Image();
      img.src = src;
    });

    // Init
    show(0);
  </script>
</body>
</html>

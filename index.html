<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slideshow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: #fff;
    }
    #slideshow {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      transition: opacity 0.5s ease;
    }
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 10px 20px;
      border-radius: 30px;
      display: flex;
      gap: 15px;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    body:hover .controls { opacity: 1; }
    button {
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: rgba(255,255,255,0.2); }
    #counter { font-size: 14px; min-width: 60px; text-align: center; }
  </style>
</head>
<body>
  <img id="slideshow" src="" alt="Slideshow">
  <div class="controls">
    <button id="prev">‹</button>
    <button id="playPause">⏸</button>
    <button id="next">›</button>
    <span id="counter"></span>
  </div>

  <script>
    // ==== EDIT THIS LIST ====
    // Add the paths to your images here
    const images = [
      "s1.png",
      "s2.png",
      "s3.png",
      "s4.png",
    ];
    // ========================

    const intervalMs = 3000; // time between slides in ms

    const imgEl = document.getElementById('slideshow');
    const counterEl = document.getElementById('counter');
    const playPauseBtn = document.getElementById('playPause');

    let index = 0;
    let playing = true;
    let timer = null;

    function show(i) {
      index = (i + images.length) % images.length;
      imgEl.style.opacity = 0;
      setTimeout(() => {
        imgEl.src = images[index];
        imgEl.style.opacity = 1;
      }, 150);
      counterEl.textContent = `${index + 1} / ${images.length}`;
    }

    function next() { show(index + 1); }
    function prev() { show(index - 1); }

    function startTimer() {
      stopTimer();
      timer = setInterval(next, intervalMs);
    }
    function stopTimer() {
      if (timer) clearInterval(timer);
      timer = null;
    }

    playPauseBtn.onclick = () => {
      playing = !playing;
      playPauseBtn.textContent = playing ? '⏸' : '▶';
      playing ? startTimer() : stopTimer();
    };
    document.getElementById('next').onclick = () => { next(); if (playing) startTimer(); };
    document.getElementById('prev').onclick = () => { prev(); if (playing) startTimer(); };

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { next(); if (playing) startTimer(); }
      if (e.key === 'ArrowLeft')  { prev(); if (playing) startTimer(); }
      if (e.key === ' ') { e.preventDefault(); playPauseBtn.click(); }
    });

    // Init
    show(0);
    if (images.length > 1) startTimer();
  </script>
</body>
</html>

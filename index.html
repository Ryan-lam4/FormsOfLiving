<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms of Living</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #track {
      display: flex;
      flex-direction: row;
      height: 100vh;
      align-items: center;
      will-change: transform;
    }

    #track img {
      height: 55vh;
      width: auto;
      flex: 0 0 auto;
      object-fit: contain;
      margin: 0;
      padding: 0;
      display: block;
      -webkit-user-drag: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="track"></div>

  <script>
    // ==== EDIT THIS LIST ====
    const images = [
      "images/st1.png",
      "images/st2.png",
      "images/st3.png",
      "images/st4.png",
      "images/st5.png",
      "images/st6.png",
      "images/st7.png",
      "images/st8.png",
      "images/st9.png",
      "images/st10.png",
      "images/st11.png",
      "images/st12.png",
      "images/st13.png",
      "images/st14.png",
      "images/st15.png",
      "images/st16.png",
    ];
    // ========================

    // ==== AUDIO ====
    const audio = new Audio('images/construction.mp3');
    audio.loop = true;
    audio.preload = 'auto';

    let audioStarted = false;

    function tryStartAudio() {
      if (audioStarted) return;
      const p = audio.play();
      if (p && typeof p.then === 'function') {
        p.then(() => { audioStarted = true; })
         .catch(() => { /* will retry on next tap */ });
      } else {
        audioStarted = true;
      }
    }
    tryStartAudio();
    // ================

    const baseSpeed = 0.6;
    const friction = 0.94;

    const track = document.getElementById('track');

    const buildImages = () => {
      track.innerHTML = '';
      for (let copy = 0; copy < 2; copy++) {
        images.forEach(src => {
          const img = document.createElement('img');
          img.src = src;
          img.alt = '';
          track.appendChild(img);
        });
      }
    };
    buildImages();

    let offset = 0;
    let velocity = 0;
    let dragging = false;
    let lastX = 0;
    let lastMoveTime = 0;
    let paused = false;
    let moved = false;
    let downX = 0, downY = 0, downTime = 0;
    let singleWidth = 0;

    function measure() {
      const kids = track.children;
      singleWidth = 0;
      for (let i = 0; i < images.length; i++) {
        singleWidth += kids[i].getBoundingClientRect().width;
      }
    }

    window.addEventListener('load', () => {
      measure();
      requestAnimationFrame(tick);
    });
    window.addEventListener('resize', measure);

    function tick() {
      if (dragging) {
        // offset is updated directly in pointermove
      } else if (paused) {
        velocity = 0;
      } else {
        offset -= (baseSpeed + velocity);
        velocity *= friction;
        if (Math.abs(velocity) < 0.01) velocity = 0;
      }

      if (singleWidth > 0) {
        if (offset <= -singleWidth) offset += singleWidth;
        if (offset > 0) offset -= singleWidth;
      }

      track.style.transform = `translate3d(${offset}px, 0, 0)`;
      requestAnimationFrame(tick);
    }

    document.addEventListener('pointerdown', (e) => {
      dragging = true;
      moved = false;
      downX = e.clientX;
      downY = e.clientY;
      downTime = performance.now();
      lastX = e.clientX;
      lastMoveTime = performance.now();
      velocity = 0;
    });

    document.addEventListener('pointermove', (e) => {
      if (!dragging) return;

      const dx = e.clientX - lastX;
      const now = performance.now();
      const dt = Math.max(1, now - lastMoveTime);

      if (Math.abs(e.clientX - downX) > 6 || Math.abs(e.clientY - downY) > 6) {
        moved = true;
      }

      if (moved) {
        paused = false;
        offset += dx;
        velocity = -dx / dt * 16;
        lastX = e.clientX;
        lastMoveTime = now;
      }
    });

    document.addEventListener('pointerup', (e) => {
      const dt = performance.now() - downTime;
      const quick = dt < 400;
      const still = Math.abs(e.clientX - downX) < 6 && Math.abs(e.clientY - downY) < 6;

      dragging = false;

      if (quick && still) {
        if (!audioStarted) {
          // First tap: start audio, don't toggle pause
          tryStartAudio();
          paused = false;
          velocity = 0;
        } else {
          paused = !paused;
          velocity = 0;
          if (paused) audio.pause();
          else audio.play().catch(() => {});
        }
      } else if (moved) {
        paused = false;
      }
    });

    document.addEventListener('pointercancel', () => {
      dragging = false;
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
  </script>
</body>
</html>

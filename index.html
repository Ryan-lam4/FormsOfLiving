<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slideshow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #track {
      display: flex;
      flex-direction: row;
      height: 100vh;
      align-items: center;
      will-change: transform;
    }
    #track img {
      height: 60vh;      /* controls how tall the images are in the void */
      width: auto;
      flex: 0 0 auto;
      object-fit: contain;
      padding: 0;        /* no gap between images */
      margin: 0;
      pointer-events: none;
      -webkit-user-drag: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="track"></div>

  <script>
    // ==== EDIT THIS LIST ====
    const images = [
      "images/st1.png",
      "images/st2.png",
      "images/st3.png",
      "images/st4.png",
      "images/st5.png",
      "images/st6.png",
      "images/st7.png",
      "images/st8.png",
      "images/st9.png",
      "images/st10.png",
      "images/st11.png",
      "images/st12.png",
      "images/st13.png",
      "images/st14.png",
      "images/st15.png",
      "images/st16.png",
    ];
    // ========================

    const baseSpeed = 0.6;
    const dragMultiplier = 0.25;
    const friction = 0.95;

    const track = document.getElementById('track');

    const buildImages = () => {
      track.innerHTML = '';
      for (let copy = 0; copy < 2; copy++) {
        images.forEach(src => {
          const img = document.createElement('img');
          img.src = src;
          img.alt = '';
          track.appendChild(img);
        });
      }
    };
    buildImages();

    let offset = 0;
    let boost = 0;
    let dragging = false;
    let lastX = 0;
    let holdPaused = false;
    let holdTimer = null;
    let singleWidth = 0;

    function measure() {
      const kids = track.children;
      singleWidth = 0;
      for (let i = 0; i < images.length; i++) {
        singleWidth += kids[i].getBoundingClientRect().width;
      }
    }

    window.addEventListener('load', () => {
      measure();
      requestAnimationFrame(tick);
    });
    window.addEventListener('resize', measure);

    function tick() {
      if (!holdPaused) {
        const speed = baseSpeed + boost;
        offset -= speed;
        boost *= friction;
        if (Math.abs(boost) < 0.01) boost = 0;
      }

      if (singleWidth > 0) {
        if (offset <= -singleWidth) offset += singleWidth;
        if (offset > 0) offset -= singleWidth;
      }

      track.style.transform = `translate3d(${offset}px, 0, 0)`;
      requestAnimationFrame(tick);
    }

    function onDown(e) {
      dragging = true;
      lastX = e.clientX;
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        if (dragging) holdPaused = true;
      }, 250);
    }

    function onMove(e) {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      lastX = e.clientX;

      if (Math.abs(dx) > 3) {
        clearTimeout(holdTimer);
        holdPaused = false;
      }

      boost -= dx * dragMultiplier;
    }

    function onUp() {
      dragging = false;
      clearTimeout(holdTimer);
      holdPaused = false;
    }

    const surface = document.body;
    surface.addEventListener('pointerdown', onDown);
    surface.addEventListener('pointermove', onMove);
    surface.addEventListener('pointerup', onUp);
    surface.addEventListener('pointercancel', onUp);
    surface.addEventListener('pointerleave', onUp);
    surface.addEventListener('contextmenu', e => e.preventDefault());
    surface.addEventListener('dragstart', e => e.preventDefault());
  </script>
</body>
</html>
